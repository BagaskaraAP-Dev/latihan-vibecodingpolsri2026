<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#070A1E" rx="12"/>
  <rect x="4" y="4" width="192" height="192" fill="none" stroke="#10B981" stroke-width="4" stroke-dasharray="8 8" rx="8"/>
  <!-- Gaming Headset -->
  <path d="M50 100 C50 65, 120 65, 120 100" fill="none" stroke="#FFE600" stroke-width="5"/>
  <rect x="44" y="92" width="12" height="22" rx="4" fill="#FF2E93" stroke="#050718" stroke-width="2"/>
  <rect x="114" y="92" width="12" height="22" rx="4" fill="#FF2E93" stroke="#050718" stroke-width="2"/>
  <!-- Belibit Body -->
  <ellipse cx="85" cy="112" rx="48" ry="34" fill="#00F0FF" stroke="#050718" stroke-width="4"/>
  <!-- Eyes with Sparkles -->
  <circle cx="68" cy="105" r="9" fill="#FFFFFF" stroke="#050718" stroke-width="3"/>
  <circle cx="68" cy="105" r="5" fill="#050718"/>
  <!-- Retro Gamepad in hands -->
  <rect x="52" y="132" width="46" height="22" rx="6" fill="#1F2937" stroke="#FFE600" stroke-width="2"/>
  <!-- D-Pad -->
  <polygon points="60,138 64,138 64,135 66,135 66,138 70,138 70,140 66,140 66,143 64,143 64,140 60,140" fill="#E5E7EB"/>
  <!-- Action Buttons -->
  <circle cx="86" cy="140" r="2.5" fill="#FF2E93"/>
  <circle cx="91" cy="143" r="2.5" fill="#00F0FF"/>
  <!-- Tail fin -->
  <polygon points="130,112 165,90 155,112 165,134" fill="#FF2E93" stroke="#050718" stroke-width="3"/>
  <!-- Text Label -->
  <rect x="35" y="165" width="130" height="25" fill="#10B981" stroke="#050718" stroke-width="2"/>
  <text x="100" y="182" font-family="'Press Start 2P', monospace" font-size="8" fill="#FFFFFF" font-weight="bold" text-anchor="middle">RETRO GAMER</text>
</svg>
